name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build all targets
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_HTTP_TIMEOUT: "120"

      - name: Read target list
        run: zig build targets > targets.list

      - name: Add Rust cross-compilation targets
        run: |
          while read -r zig_triple rust_triple bin_suffix; do
            rustup target add "$rust_triple"
          done < targets.list

      - name: Build all targets
        env:
          RUSTC_WRAPPER: ""
        run: |
          while read -r zig_triple rust_triple bin_suffix; do
            echo "::group::Build ${bin_suffix}"
            zig build -Dtarget="${zig_triple}"
            cp "target/${rust_triple}/release/boom-sshh" "boom-sshh-${bin_suffix}"
            echo "::endgroup::"
          done < targets.list

      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: boom-sshh-*

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist

      - name: Add install script + checksums
        run: |
          chmod +x install.sh
          cp install.sh dist/install.sh
          cd dist && sha256sum boom-sshh-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/boom-sshh-*
            dist/checksums.txt
            dist/install.sh
