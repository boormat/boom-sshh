[package]
name = "boom-sshh"
version = "0.3.3"
edition = "2021"
description = "SSH agent with HISTORY extension for logging remote commands"

[[bin]]
name = "boom-sshh"
path = "src/main.rs"

[dependencies]
ssh-agent-lib = "0.6"
ssh-key = { version = "0.6", features = ["crypto"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "signal"] }
async-trait = "0.1"
env_logger = "0.11"
log = "0.4"

# Key signing dependencies
ed25519-dalek = "2"
rsa = "0.9"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"

# Approval prompting (askpass) + JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Approval UI: terminal panel (tty) + raw-mode terminal handling
ratatui = { version = "0.29", default-features = false, features = ["termion"] }
termion = "4"

# Agent daemonization
libc = "0.2"
