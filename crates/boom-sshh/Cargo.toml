[package]
name = "boom-sshh"
version = "0.1.0"
edition = "2021"
description = "SSH agent with HISTORY extension for logging remote commands"

[[bin]]
name = "boom-sshh"
path = "src/main.rs"

[dependencies]
ssh-agent-lib = "0.6"
ssh-key = { version = "0.6", features = ["crypto"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
async-trait = "0.1"
env_logger = "0.11"
log = "0.4"

# Key signing dependencies
ed25519-dalek = "2"
rsa = "0.9"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
